name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install --global @deepseek-ai/dsh@0.1.0-rc.7
      - run: pnpm run verify
      - name: Check generated artifacts are committed
        run: git diff --exit-code -- packages/aside-host/lib packages/client-ui-aside/lib
